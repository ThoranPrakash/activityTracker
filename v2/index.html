<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FitTracker">
<meta name="description" content="Personal recomp tracker: workouts, food, habits and weekly review.">
<title>FitTracker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<main class="app">
  <section class="screen" id="screen-today"></section>
  <section class="screen" id="screen-workout"></section>
  <section class="screen" id="screen-food"></section>
  <section class="screen" id="screen-progress"></section>
</main>

<div class="rest" id="rest">
  <div class="prog"></div>
  <span>⏱ Rest</span><span class="time grow">0:00</span>
  <button data-a="restAdd" data-s="-15">−15</button>
  <button data-a="restAdd" data-s="15">+15</button>
  <button data-a="restSkip">Skip</button>
</div>

<nav class="tabbar"><div class="tabbar-in">
  <button class="tab" data-a="tab" data-t="today">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg>Today</button>
  <button class="tab" data-a="tab" data-t="workout">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>Workout</button>
  <button class="tab" data-a="tab" data-t="food">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M7 3v8a2 2 0 0 0 2 2v8M5 3v5M9 3v5M17 21V3c-2 1-3 4-3 8h3"/></svg>Food</button>
  <button class="tab" data-a="tab" data-t="progress">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-5 4 3 8-8M15 7h5v5"/></svg>Progress</button>
</div></nav>

<div class="overlay" id="overlay"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="sheet-h"><h2 id="sheet-title"></h2><div class="row"><span id="sheet-right"></span><button class="icon-btn" data-a="closeSheet" aria-label="Close">✕</button></div></div>
  <div class="sheet-b" id="sheet-body"></div>
</div>
<div class="toast" id="toast"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
