<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="0; url=../">
<title>FitTracker has moved</title>
<style>body{background:#000;color:#98989F;font-family:-apple-system,sans-serif;text-align:center;padding:80px 20px}a{color:#A6FF00}</style>
</head>
<body>
<p>FitTracker now lives at the main address.</p>
<p><a href="../">Open FitTracker</a></p>
<script>
// The app moved from /v2/ to the site root. Your data is stored per site, so it carries over.
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations()
    .then(rs => Promise.all(rs.filter(r => r.scope.endsWith('/v2/')).map(r => r.unregister())))
    .finally(() => location.replace('../'));
} else {
  location.replace('../');
}
</script>
</body>
</html>
